name: Revisar correo

# GitHub revisa el buzón cada 5 minutos. No se puede al instante porque
# GitHub no permite correr más seguido; puede demorar unos minutos más
# cuando hay mucha carga en sus servidores.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: correo
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Revisar buzón y avisar al bot
        env:
          CORREO_USUARIO: ${{ secrets.CORREO_USUARIO }}
          CORREO_CLAVE: ${{ secrets.CORREO_CLAVE }}
          CORREO_IMAP_HOST: ${{ secrets.CORREO_IMAP_HOST }}
          CORREO_SMTP_HOST: ${{ secrets.CORREO_SMTP_HOST }}
          CORREO_NOMBRE: ${{ secrets.CORREO_NOMBRE }}
          BOT_URL: ${{ secrets.BOT_URL }}
          BOT_CLAVE: ${{ secrets.BOT_CLAVE }}
        run: node scripts/correo-cron.js
